<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SingleCircle - Connect & Hangout</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Premium Dark Gradient Background */
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Orb in Background */
        .glow-effect {
            position: absolute;
            width: 70vw;
            height: 70vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0, 0, 0, 0) 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Main Content Container with Animation */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 2rem;
            text-align: center;
            animation: smoothFadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Bold, Clean Typography */
        h1 {
            color: #f8fafc;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        /* Gradient Text for Brand Name */
        .highlight {
            background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Clean, Readable Subtext */
        p {
            color: #94a3b8;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto;
            font-weight: 400;
        }

        /* Custom Animation Keyframes */
        @keyframes smoothFadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Background Glow -->
    <div class="glow-effect"></div>

    <!-- Main Content -->
    <div class="container">
        <h1>Welcome to <br><span class="highlight">SingleCircle</span></h1>
        <p>A mutual space for friends and college students to connect, talk, and hang out.</p>
    </div>

</body>
</html>
